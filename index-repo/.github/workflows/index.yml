name: Build skills index
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: skills-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-skip-report
          path: skipped-skills.json
      - name: Commit index and skip report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills-index.json skipped-skills.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update skills index'
            git push
          fi
